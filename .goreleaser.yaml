# Release configuration for Osmium.
#
# `make snapshot` builds everything below locally without tagging anything;
# `make release` publishes it for the tag you are on.
version: 2

project_name: osmium

before:
  hooks:
    - go mod tidy
    # The completions are generated by the binary itself, so they can never
    # describe a different set of commands than the one being shipped.
    - mkdir -p completions
    - sh -c "go run . completion bash > completions/osmium.bash"
    - sh -c "go run . completion zsh  > completions/_osmium"
    - sh -c "go run . completion fish > completions/osmium.fish"

builds:
  - id: osmium
    main: .
    binary: osmium
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      # The same stamps the Makefile applies, so a release binary can say what
      # it is.
      - -s -w
      - -X github.com/limelamp/osmium/internal/build.Version={{ .Version }}
      - -X github.com/limelamp/osmium/internal/build.Commit={{ .ShortCommit }}
      - -X github.com/limelamp/osmium/internal/build.Date={{ slice .CommitDate 0 10 }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: osmium
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - NOTICE
      - src: completions/*
        dst: completions

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  format: "{{ .SHA }}: {{ .Message }}{{ with .AuthorUsername }} (@{{ . }}){{ end }}"
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  draft: false
  prerelease: auto
  footer: |
    ---
    Osmium is free software under the GNU General Public License v3.0.
    Copyright © 2026 Limelamp.
